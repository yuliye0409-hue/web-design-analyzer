services:
  web-design-analyzer:
    build: .
    init: true
    restart: unless-stopped
    ports:
      - "4173:4173"
    environment:
      NODE_ENV: production
      PORT: 4173
      HOST: 0.0.0.0
      RATE_LIMIT: 6
      RATE_WINDOW_MS: 60000
      MAX_CONCURRENT_ANALYSES: 1
    shm_size: 1gb
